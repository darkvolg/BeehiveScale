; BeehiveScale — PlatformIO configuration
; Альтернатива Arduino IDE. Параметры подобраны под реальную плату,
; которую использует Геннадий (Wemos D1 mini, 4M FS:2M OTA:~1M, SSL all).
;
; Использование:
;   pio run                 — сборка
;   pio run -t upload       — прошивка через USB
;   pio run -t uploadfs     — загрузка LittleFS образа (если data/ есть)

[platformio]
default_envs = d1_mini
src_dir = BeehiveScale

; ───── Общие настройки ESP8266 ─────
[env]
platform = espressif8266 @ ~4.2.1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Flash layout: 4 MB, FS 2 MB, OTA ~1019 KB
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m2m.ld

; Библиотеки — жёстко закреплены (версии, которые работают)
; ArduinoJson: код написан под v6 API; v7 тоже компилируется (deprecation warnings)
lib_deps =
  bogde/HX711@^0.7.5
  marcoschwartz/LiquidCrystal_I2C@^1.1.4
  paulstoffregen/OneWire@^2.3.8
  milesburton/DallasTemperature@^3.11.0
  adafruit/RTClib@^2.1.4
  bblanchon/ArduinoJson@^6.21.5

build_flags =
  -D NDEBUG
  -D MMU_IRAM_SIZE=0x8000
  -D MMU_ICACHE_SIZE=0x8000
  -Wall

; ───── Основная плата: Wemos D1 mini ─────
[env:d1_mini]
board = d1_mini

; ───── Альтернатива: NodeMCU v2 (Lolin) ─────
[env:nodemcuv2]
board = nodemcuv2

; ───── Debug сборка ─────
[env:d1_mini-debug]
extends = env:d1_mini
build_flags =
  ${env.build_flags}
  -D BEEHIVE_DEBUG=1
build_type = debug

; ───── OTA прошивка ─────
[env:d1_mini-ota]
extends = env:d1_mini
upload_protocol = espota
; upload_port и OTA пароль задаются через переменные окружения:
;   PLATFORMIO_UPLOAD_PORT=192.168.x.x
;   PLATFORMIO_UPLOAD_FLAGS=--auth=<ota_password>
